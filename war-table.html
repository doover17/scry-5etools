		</header>

		<!-- Mode toggle + persistence toolbar -->
		<div class="wt-header" id="wt-header">
			<div class="wt-header__controls">
				<div class="wt-mode-toggle" id="wt-mode-toggle">
					<button class="wt-mode-toggle__btn wt-mode-toggle__btn--active" data-mode="planning">Planning</button>
					<button class="wt-mode-toggle__btn" data-mode="live">Live</button>
				</div>
			</div>
			<div class="wt-persist" id="wt-persist">
				<button class="wt-persist__btn" id="wt-export">Export</button>
				<button class="wt-persist__btn" id="wt-import">Import</button>
				<button class="wt-persist__btn wt-persist__btn--danger" id="wt-reset">Reset</button>
			</div>
		</div>

		<!-- Two-column standalone layout -->
		<div class="wt-standalone" id="wt-standalone">
			<div class="wt-standalone__module" id="wt-planner-col">

<script type="text/javascript" src="js/war-table-planner.js"></script>
<script type="text/javascript" src="js/war-table-forecast.js"></script>

<!-- Page bootstrap -->
<script type="text/javascript">
// [PERSONAL] DH 2026-03-24 — War Table page bootstrap
(async () => {
	// Wait for navigation to initialize
	await new Promise(resolve => {
		if (typeof Navigation !== "undefined" && Navigation.init) {
			Navigation.init();
		}
		// Give navigation time to render
		setTimeout(resolve, 50);
	});

	// Initialize shared state
	const state = WarTableState.getInstance();

	// -- Mode toggle --
	const modeToggle = document.getElementById("wt-mode-toggle");
	if (modeToggle) {
		const updateToggle = () => {
			modeToggle.querySelectorAll("[data-mode]").forEach(btn => {
				btn.classList.toggle("wt-mode-toggle__btn--active", btn.dataset.mode === state.getMode());
			});
		};

		modeToggle.querySelectorAll("[data-mode]").forEach(btn => {
			btn.addEventListener("click", () => {
				state.setMode(btn.dataset.mode);
				updateToggle();
			});
		});

		state.on("modeChange", updateToggle);
		updateToggle();
	}

	// -- Persistence toolbar --
	document.getElementById("wt-export")?.addEventListener("click", () => {
		const json = state.exportJSON();
		const blob = new Blob([json], {type: "application/json"});
		const url = URL.createObjectURL(blob);
		const a = document.createElement("a");
		a.href = url;
		a.download = `war-table-${new Date().toISOString().slice(0, 10)}.json`;
		a.click();
		URL.revokeObjectURL(url);
	});

	document.getElementById("wt-import")?.addEventListener("click", () => {
		const input = document.createElement("input");
		input.type = "file";
		input.accept = ".json";
		input.addEventListener("change", async () => {
			const file = input.files?.[0];
			if (!file) return;
			try {
				const text = await file.text();
				const ok = state.importJSON(text);
				if (!ok) alert("Failed to import. Check the file format.");
			} catch (e) {
				console.error("War Table: import error", e);
				alert("Failed to read file.");
			}
		});
		input.click();
	});

	document.getElementById("wt-reset")?.addEventListener("click", () => {
		if (confirm("Reset all War Table data? This cannot be undone.")) {
			state.resetState();
		}
	});

	// -- Initialize modules --
	const planner = new WarTablePlanner({state});
	const forecast = new WarTableForecast({state});

	await planner.pInit();

	planner.renderTo(document.getElementById("wt-planner-root"));
	forecast.renderTo(document.getElementById("wt-forecast-root"));
})();
</script>
